<!doctype html>
<html lang="sr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CarGram</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="app">

    <!-- LEFT MENU -->
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-dot"></span>
        <span class="brand-name">CarGram</span>
      </div>

      <nav class="menu">
        <a class="menu-item active" href="#">
          <span class="icon">⌂</span><span>Home</span>
        </a>
        <a class="menu-item" href="#"><span class="icon">🔎</span><span>Search</span></a>
        <a class="menu-item" href="#"><span class="icon">🧭</span><span>Explore</span></a>
        <a class="menu-item" href="#"><span class="icon">🎞️</span><span>Reels</span></a>
        <a class="menu-item" href="#"><span class="icon">💬</span><span>Messages</span></a>
        <a class="menu-item" href="#"><span class="icon">🔔</span><span>Notifications</span></a>
        <a class="menu-item" href="#"><span class="icon">➕</span><span>Create</span></a>
        <a class="menu-item" href="#"><span class="icon">👤</span><span>Profile</span></a>
      </nav>

      <div class="sidebar-bottom">
        <a class="menu-item" href="#"><span class="icon">☰</span><span>More</span></a>
      </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="main">

      <!-- PROFILE HEADER -->
      <section class="profile-header">
        <div class="avatar-wrap">
          <img class="avatar" src="img/avatar.jpg" alt="Profilna slika" />
        </div>

        <div class="profile-info">
          <div class="top-row">
            <h1 class="username">car.ninja</h1>
            <div class="actions">
              <button class="btn primary">Follow</button>
              <button class="btn">Message</button>
            </div>
          </div>

          <div class="stats">
            <div><strong>9</strong> posts</div>
            <div><strong>1,204</strong> followers</div>
            <div><strong>321</strong> following</div>
          </div>

          <div class="bio">
            <p class="name">CarGram • Činjenice</p>
            <p class="link">car.org • docs • tips</p>
          </div>
        </div>
      </section>

      <!-- TABS -->
      <section class="tabs">
        <button class="tab active">Posts</button>
        <button class="tab">Saved</button>
        <button class="tab">Tagged</button>
      </section>

      <!-- GRID 3x3 -->
      <section class="grid">
        <!-- Svaka kartica može da ima sliku + overlay tekst -->
        <article class="post">
          <img src="img/p1.jpg" alt="Post 1" />
          <div class="overlay">Car1</div>
        </article>

        <article class="post">
          <img src="img/p2.jpg" alt="Post 2" />
          <div class="overlay">Car1</div>
        </article>

        <article class="post">
          <img src="img/p3.jpg" alt="Post 3" />
          <div class="overlay">Car1</div>
        </article>

        <article class="post">
          <img src="img/p4.jpg" alt="Post 4" />
          <div class="overlay">Car1</div>
        </article>

        <article class="post">
          <img src="img/p5.jpg" alt="Post 5" />
          <div class="overlay">Car1</div>
        </article>

        <article class="post">
          <img src="img/p6.jpg" alt="Post 6" />
          <div class="overlay">Car1v</div>
        </article>

        <article class="post">
          <img src="img/p7.jpg" alt="Post 7" />
          <div class="overlay">Car1</div>
        </article>

        <article class="post">
          <img src="img/p8.jpg" alt="Post 8" />
          <div class="overlay">Car1</div>
        </article>

        <article class="post">
          <img src="img/p9.jpg" alt="Post 9" />
          <div class="overlay">Car1</div>
        </article>
      </section>

      <footer class="footer">
        <span>© 2026 CarGram — HTML + CSS</span>
      </footer>

    </main>
  </div>

</body>
</html>
